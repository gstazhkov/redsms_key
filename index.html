<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedSMS Knowledge Base</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0; }

    .header {
      background: linear-gradient(135deg, #E74C3C 0%, #C0392B 100%);
      color: white;
      padding: 3rem 2rem;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 1rem;
      opacity: 0.95;
      margin-bottom: 2rem;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
      max-width: 500px;
      margin: 0 auto;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .search-box input {
      flex: 1;
      border: none;
      padding: 0.75rem;
      font-size: 0.95rem;
      background: rgba(255,255,255,0.95);
      border-radius: 6px;
      color: #2C3E50;
    }

    .search-box input::placeholder {
      color: #95A5A6;
    }

    .search-box input:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.2);
    }

    .content {
      padding: 2rem;
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 2rem;
      min-height: calc(100vh - 280px);
    }

    .sidebar {
      background: #F8F9FA;
      padding: 1.5rem;
      border-radius: 8px;
      height: fit-content;
      border: 1px solid #ECF0F1;
      max-height: 80vh;
      overflow-y: auto;
    }

    .sidebar h3 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #7F8C8D;
      margin-bottom: 1rem;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar li {
      margin-bottom: 0.5rem;
    }

    .sidebar button {
      width: 100%;
      text-align: left;
      padding: 0.65rem 0.75rem;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 0.9rem;
      color: #34495E;
      border-radius: 5px;
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }

    .sidebar button:hover {
      background: #E8EAED;
      border-left-color: #E74C3C;
    }

    .sidebar button.active {
      background: white;
      color: #E74C3C;
      border-left-color: #E74C3C;
      font-weight: 600;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: white;
      border: 1px solid #ECF0F1;
      border-radius: 8px;
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #E74C3C;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s;
    }

    .card:hover {
      border-color: #E74C3C;
      box-shadow: 0 4px 12px rgba(231, 76, 60, 0.1);
      transform: translateY(-2px);
    }

    .card:hover::before {
      transform: scaleX(1);
    }

    .card-icon {
      font-size: 2rem;
      margin-bottom: 1rem;
      display: inline-block;
    }

    .card h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2C3E50;
      margin-bottom: 0.5rem;
    }

    .card p {
      font-size: 0.85rem;
      color: #7F8C8D;
      line-height: 1.5;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 8px;
      max-width: 700px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #95A5A6;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: #E74C3C;
    }

    .modal h2 {
      font-size: 1.8rem;
      color: #2C3E50;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #E74C3C;
    }

    .modal-section {
      margin-bottom: 2rem;
    }

    .modal-section h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #E74C3C;
      margin-bottom: 0.75rem;
      margin-top: 1.5rem;
    }

    .modal-section h3:first-of-type {
      margin-top: 0;
    }

    .modal-section p, .modal-section li {
      color: #34495E;
      line-height: 1.7;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .modal-section ul {
      margin-left: 1.5rem;
      margin-bottom: 1rem;
    }

    .modal-section a {
      color: #E74C3C;
      text-decoration: none;
    }

    .modal-section a:hover {
      text-decoration: underline;
    }

    .response-box {
      background: #F8F9FA;
      border-left: 3px solid #E74C3C;
      padding: 1rem;
      border-radius: 4px;
      margin-top: 0.75rem;
      font-style: italic;
      color: #34495E;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 2rem;
      color: #95A5A6;
    }

    /* Mobile Responsive Styles */
    @media (max-width: 768px) {
      .header {
        padding: 2rem 1rem;
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .header p {
        font-size: 0.9rem;
      }

      .search-box {
        max-width: 100%;
        flex-direction: column;
      }

      .search-box input {
        width: 100%;
      }

      .content {
        padding: 1rem;
        display: block;
        min-height: auto;
      }

      .sidebar {
        display: none;
        position: fixed;
        left: 0;
        top: 60px;
        width: 100%;
        height: calc(100vh - 60px);
        z-index: 50;
        border-radius: 0;
        max-height: 100%;
        background: white;
        border: none;
        padding: 1rem;
        overflow-y: auto;
      }

      .sidebar.open {
        display: block;
      }

      .cards-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .card {
        padding: 1rem;
      }

      .card h3 {
        font-size: 1rem;
      }

      .card p {
        font-size: 0.8rem;
      }

      .modal-content {
        padding: 1.5rem;
        max-height: 90vh;
        max-width: 95%;
      }

      .modal h2 {
        font-size: 1.3rem;
        margin-bottom: 0.75rem;
        padding-bottom: 0.75rem;
      }

      .modal-section h3 {
        font-size: 0.95rem;
      }

      .modal-section p, .modal-section li {
        font-size: 0.85rem;
      }

      #sidebar-toggle {
        display: inline-block !important;
      }

      .status-btn {
        padding: 0.4rem 0.7rem !important;
        font-size: 0.8rem !important;
        margin-right: 0.3rem !important;
        margin-bottom: 0.5rem;
      }

      .copy-btn {
        padding: 0.4rem 0.8rem !important;
        font-size: 0.8rem !important;
      }
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 1.4rem;
        margin-bottom: 0.3rem;
      }

      .header {
        padding: 1.5rem 1rem;
      }

      .header p {
        font-size: 0.8rem;
        margin-bottom: 1rem;
      }

      .search-box {
        padding: 0.4rem;
      }

      .search-box input {
        padding: 0.6rem;
        font-size: 0.85rem;
      }

      .card-icon {
        font-size: 1.5rem;
      }

      .modal-content {
        padding: 1rem;
        max-width: 100%;
        margin: 0.5rem;
      }

      .modal-close {

      }

      .modal h2 {

      }

      .response-box {

        font-size: 0.8rem;
      }

      .sidebar h3 {

      .sidebar button {

      .add-btn {

      }

      .status-btn {

        font-size: 0.7rem !important;
        margin-right: 0.2rem !important;
      }

      [onclick*="deleteCard"] {

        font-size: 0.7rem !important;
      }
    }

    .no-results p {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .status-badge.ready {
      background: #D4EDDA;
      color: #155724;
    }

    .status-badge.draft {
      background: #FFF3CD;
      color: #856404;
    }

    .status-badge.internal {
      background: #D1ECF1;
      color: #0C5460;
    }

    .copy-btn {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.5rem 1rem;
      background: #E74C3C;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: #C0392B;
      transform: scale(1.05);
    }

    .copy-btn.copied {
      background: #27AE60;
    }

    .response-wrapper {
      position: relative;
    }

    .add-new-btn {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1.5rem;
      background: #27AE60;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .add-new-btn:hover {
      background: #229954;
    }

    .status-btn {
      padding: 0.5rem 1rem;
      margin-right: 0.5rem;
      margin-bottom: 0.75rem;
      background: #ECF0F1;
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .status-btn:hover {
      border-color: #E74C3C;
    }

    .status-btn.active {
      background: #E74C3C;
      color: white;
      border-color: #E74C3C;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #2C3E50;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ECF0F1;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-actions {
      display: flex;
      gap: 1rem;
    }

    .form-actions button {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-save {
      background: #27AE60;
      color: white;
    }

    .btn-save:hover {
      background: #229954;
    }

    .btn-cancel {
      background: #ECF0F1;
      color: #2C3E50;
    }

    .btn-cancel:hover {
      background: #D5DBDB;
    }

    .login-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #E74C3C 0%, #C0392B 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .login-container.hidden {
      display: none;
    }

    .login-box {
      background: white;
      padding: 3rem;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-box h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #2C3E50;
    }

    .login-box p {
      color: #7F8C8D;
      margin-bottom: 2rem;
    }

    .login-input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ECF0F1;
      border-radius: 4px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .login-input:focus {
      outline: none;
      border-color: #E74C3C;
      box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #E74C3C 0%, #C0392B 100%);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
    }

    .logout-btn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s;
      z-index: 999;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    .login-error {
      color: #E74C3C;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      display: none;
    }

    .sidebar-toggle {
      display: none;
      position: fixed;
      left: 1rem;
      top: 1.5rem;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.2rem;
      z-index: 51;
      font-weight: 600;
      transition: all 0.2s;
    }

    .sidebar-toggle:hover {
      background: rgba(255,255,255,0.3);
    }

    @media (max-width: 768px) { { { {
      .content {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .cards-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      }

      .header h1 {
        font-size: 1.8rem;
      }
    

    @media (max-width: 480px) {
      .header {
        padding: 1.5rem 1rem;
      }

      .header h1 {
        font-size: 1.5rem;
        margin-bottom: 0.3rem;
      }

      .header p {
        font-size: 0.8rem;
        margin-bottom: 1rem;
      }

      .cards-grid {
        gap: 0.75rem;
      }

      .card {
        padding: 1rem;
      }

      .card-icon {
        font-size: 1.5rem;
      }

      .card h3 {
        font-size: 0.95rem;
      }

      .card p {
        font-size: 0.75rem;
        line-height: 1.4;
      }

      .modal-content {
        padding: 1rem;
      }

      .modal h2 {
        font-size: 1.3rem;
      }

      .status-badge {
        padding: 0.2rem 0.6rem;
        font-size: 0.75rem;
      }
    }
}
  </style>
</head>
<body>
<button class="logout-btn" id="logout-btn" style="display:none;" onclick="logout()">🚪 Выход</button>

<div class="login-container" id="login-container">
  <div class="login-box">
    <h1>🔐 RedSMS KB</h1>
    <p>Введите пароль для доступа</p>
    <div class="login-error" id="login-error">Неверный пароль</div>

<button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()">☰ Меню</button>
    <input type="password" id="password-input" class="login-input" placeholder="Пароль" onkeypress="handleKeyPress(event)">
    <button class="login-btn" onclick="checkPassword()">Войти</button>
  </div>
</div>

<div class="container">
  <div class="header">
    <h1>📚 RedSMS Knowledge Base</h1>
    <p>Найдите ответ за секунды</p>
    <div class="search-box">
      <input type="text" id="search" placeholder="Ищите по ключевому слову...">
    </div>
  </div>

  <div class="content">
    <div class="sidebar">
      <h3>Категории</h3>
      <ul id="categories-list"></ul>
      <button class="add-new-btn" onclick="openAddNewForm()">➕ Добавить карточку</button>
    </div>

    <div id="cards-container" class="cards-grid"></div>
  </div>

  <div id="add-modal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeAddModal()">✕</button>
      <h2>➕ Добавить новую карточку</h2>
      <div id="add-form">
        <div class="form-group">
          <label>Название</label>
          <input type="text" id="new-title" placeholder="Введите название карточки">
        </div>
        <div class="form-group">
          <label>Описание</label>
          <textarea id="new-description" placeholder="Введите описание"></textarea>
        </div>
        <div class="form-group">
          <label>Категория</label>
          <select id="new-category"></select>
        </div>
        <div class="form-group">
          <label>Статус</label>
          <select id="new-status">
            <option value="ready">Готово</option>
            <option value="draft">Черновик</option>
            <option value="internal">Внутреннее</option>
          </select>
        </div>
        <div class="form-group">
          <label>Текст ответа</label>
          <textarea id="new-response" placeholder="Введите текст ответа"></textarea>
        </div>
        <div class="form-actions">
          <button class="btn-save" onclick="saveNewCard()">Сохранить</button>
          <button class="btn-cancel" onclick="closeAddModal()">Отмена</button>
        </div>
      </div>
    </div>
  </div>

    <div id="modal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>
</div>

let filteredData = [];
let currentCategory = "all";

const cardsContainer = document.getElementById('cards-container');
const searchInput = document.getElementById('search');
const categoriesList = document.getElementById('categories-list');

function renderCategories() {
  categoriesList.innerHTML = kbData.categories.map(cat => `
    <li>
      <button class="category-btn ${cat.id === 'all' ? 'active' : ''}" data-category="${cat.id}">
        ${cat.icon} ${cat.label}
      </button>
    </li>
  `).join('');
  
  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.dataset.category;
      filterCards();
    });
  });
}

function renderCards() {
  if (filteredData.length === 0) {
    cardsContainer.innerHTML = '<div class="no-results"><p>Ничего не найдено 😔</p><p>Попробуйте другой поисковый запрос</p></div>';
    return;
  }

  cardsContainer.innerHTML = filteredData.map(item => {
    const categoryData = kbData.categories.find(c => c.id === item.category);
    const categoryIcon = categoryData ? categoryData.icon : '';
    
    return `
      <div class="card" onclick="openModal(${item.id})">
        <div class="card-icon">${categoryIcon}</div>
        <h3>${item.title}</h3>
        <p>${item.description}</p>
      </div>
    `;
  }).join('');
}

function filterCards() {
  filteredData = kbData.data.filter(item => {
    const matchCategory = currentCategory === 'all' || item.category === currentCategory;
    const matchSearch = item.title.toLowerCase().includes(searchInput.value.toLowerCase()) ||
                       item.description.toLowerCase().includes(searchInput.value.toLowerCase());
    return matchCategory && matchSearch;
  });
  renderCards();
}

function openModal(id) {
  const item = kbData.data.find(d => d.id === id);
  const categoryData = kbData.categories.find(c => c.id === item.category);
  const categoryIcon = categoryData ? categoryData.icon : '';
  const modalBody = document.getElementById('modal-body');
  
  let content = `
    <div>
      <div class="status-badge ${item.status}">${item.status === 'ready' ? 'Готово' : item.status === 'draft' ? 'Черновик' : 'Внутреннее'}</div>
      <h2>${categoryIcon} ${item.title}</h2>
      <div style="margin-top: 1rem; margin-bottom: 1rem;">
        <div>
          <button class="status-btn ${item.status === 'ready' ? 'active' : ''}" data-status="ready" onclick="changeStatus(${item.id}, 'ready')">✅ Готово</button>
          <button class="status-btn ${item.status === 'draft' ? 'active' : ''}" data-status="draft" onclick="changeStatus(${item.id}, 'draft')">📝 Черновик</button>
          <button class="status-btn ${item.status === 'internal' ? 'active' : ''}" data-status="internal" onclick="changeStatus(${item.id}, 'internal')">🔒 Внутреннее</button>
        </div>
        <button style="margin-top: 0.75rem; padding: 0.5rem 1rem; background: #E74C3C; color: white; border: none; border-radius: 4px; cursor: pointer;" onclick="deleteCard(${item.id})">🗑️ Удалить</button>
      </div>
    </div>
  `;
  
  for (const [key, value] of Object.entries(item.details)) {
    if (key === 'response') {
      const responseId = 'response-' + item.id;
      content += `<div class="modal-section"><div class="response-wrapper"><div class="response-box" id="${responseId}">${value.replace(/\n/g, '<br>')}</div><button class="copy-btn" onclick="copyToClipboard('${responseId}', this)">📋 Копировать</button></div></div>`;
    } else if (key === 'action' || key === 'actions') {
      content += `<div class="modal-section"><h3>Что делать:</h3><p>${value}</p></div>`;
    } else if (key === 'info') {
      content += `<div class="modal-section"><h3>Информация:</h3><p>${value}</p></div>`;
    } else if (key === 'trigger') {
      content += `<div class="modal-section"><h3>Триггер:</h3><p>${value}</p></div>`;
    } else if (key === 'links' && Array.isArray(value)) {
      content += `<div class="modal-section"><h3>Документация:</h3><ul>`;
      value.forEach(link => {
        content += `<li><a href="${link[1]}" target="_blank">${link[0]}</a></li>`;
      });
      content += `</ul></div>`;
    } else if (key === 'rates' || key === 'statuses' || key === 'setup' || key === 'security' || key === 'recommendation' || key === 'process' || key === 'topics' || key === 'note') {
      const headerMap = {
        'rates': 'Тарифы',
        'statuses': 'Статусы',
        'setup': 'Настройка',
        'security': 'Безопасность',
        'recommendation': 'Рекомендация',
        'process': 'Процесс',
        'topics': 'Касается',
        'note': 'Важно'
      };
      
      if (key === 'note') {
        content += `<div class="modal-section"><p><strong>⚠️ ${headerMap[key]}:</strong> ${value}</p></div>`;
      } else if (key === 'topics') {
        content += `<div class="modal-section"><p><strong>${headerMap[key]}:</strong> ${value}</p></div>`;
      } else {
        content += `<div class="modal-section"><h3>${headerMap[key]}:</h3><p>${value.replace(/\n/g, '<br>')}</p></div>`;
      }
    }
  }
  
  modalBody.innerHTML = content;
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function openAddNewForm() {
  const categorySelect = document.getElementById('new-category');
  categorySelect.innerHTML = kbData.categories
    .filter(c => c.id !== 'all')
    .map(c => `<option value="${c.id}">${c.label}</option>`)
    .join('');
  
  document.getElementById('new-title').value = '';
  document.getElementById('new-description').value = '';
  document.getElementById('new-response').value = '';
  document.getElementById('new-status').value = 'draft';
  
  document.getElementById('add-modal').classList.add('active');
}

function closeAddModal() {
  document.getElementById('add-modal').classList.remove('active');
}

function saveNewCard() {
  const title = document.getElementById('new-title').value.trim();
  const description = document.getElementById('new-description').value.trim();
  const category = document.getElementById('new-category').value;
  const status = document.getElementById('new-status').value;
  const response = document.getElementById('new-response').value.trim();

  if (!title || !category) {
    alert('Заполните названия и выберите категорию');
    return;
  }

  const newId = Math.max(...kbData.data.map(d => d.id), 0) + 1;
  
  const newCard = {
    id: newId,
    title: title,
    category: category,
    status: status,
    description: description,
    details: {
      response: response || 'Нет информации'
    }
  };

  kbData.data.push(newCard);
  localStorage.setItem('kbData', JSON.stringify(kbData));
  
  closeAddModal();
  filterCards();
  alert('✅ Карточка добавлена!');
}

function changeStatus(id, newStatus) {
  const item = kbData.data.find(d => d.id === id);
  if (item) {
    item.status = newStatus;
    localStorage.setItem('kbData', JSON.stringify(kbData));
    const statusBtn = document.querySelector(`.status-btn[data-status="${newStatus}"]`);
    document.querySelectorAll('.status-btn').forEach(btn => btn.classList.remove('active'));
    if (statusBtn) statusBtn.classList.add('active');
  }
}

function deleteCard(id) {
  if (confirm('Вы уверены? Это действие необратимо.')) {
    kbData.data = kbData.data.filter(d => d.id !== id);
    localStorage.setItem('kbData', JSON.stringify(kbData));
    closeModal();
    filterCards();
    alert('✅ Карточка удалена!');
  }
}

function loadFromStorage() {
  const saved = localStorage.getItem('kbData');
  if (saved) {
    try {
      const loadedData = JSON.parse(saved);
      kbData.data = loadedData.data || kbData.data;
    } catch (e) {
      console.log('Не удалось загрузить из localStorage');
    }
  }
}

function resetToDefault() {
  if (confirm('Это вернёт все карточки к исходному состоянию. Вы уверены?')) {
    localStorage.removeItem('kbData');
    location.reload();
  }
}


searchInput.addEventListener('input', filterCards);

document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});

// Load saved data
loadFromStorage();

// Initialize
filteredData = [...kbData.data];
renderCategories();
renderCards();

function copyToClipboard(elementId, button) {
  const element = document.getElementById(elementId);
  const text = element.innerText;
  
  navigator.clipboard.writeText(text).then(() => {
    const originalText = button.textContent;
    button.textContent = '✓ Скопировано!';
    button.classList.add('copied');
    
    setTimeout(() => {
      button.textContent = originalText;
      button.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    alert('Ошибка копирования');
  });
}

function checkPassword() {
  const password = document.getElementById('password-input').value;
  const errorDiv = document.getElementById('login-error');
  
  if (password === 'redsms') {
    localStorage.setItem('redsms_authenticated', 'true');
    showMainContent();
    errorDiv.style.display = 'none';
  } else {
    errorDiv.style.display = 'block';
    document.getElementById('password-input').value = '';
  }
}

function handleKeyPress(event) {
  if (event.key === 'Enter') {
    checkPassword();
  }
}

function showMainContent() {
  document.getElementById('login-container').classList.add('hidden');
  document.getElementById('logout-btn').style.display = 'block';
  document.getElementById('sidebar-toggle').style.display = 'inline-block';
  document.body.style.overflow = 'auto';
}

function logout() {
  localStorage.removeItem('redsms_authenticated');
  document.getElementById('login-container').classList.remove('hidden');
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('sidebar-toggle').style.display = 'none';
  document.getElementById('password-input').value = '';
  document.body.style.overflow = 'hidden';
}

function checkAuthentication() {
  const isAuthenticated = localStorage.getItem('redsms_authenticated') === 'true';
  
  if (isAuthenticated) {
    showMainContent();
  } else {
    document.body.style.overflow = 'hidden';
  }
}

// Check authentication on page load
checkAuthentication();

function toggleSidebar() {
  const sidebar = document.querySelector('.sidebar');
  sidebar.classList.toggle('open');
}

// Close sidebar when clicking outside or selecting category
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelector('.sidebar').classList.remove('open');
    });
  });
  
  document.addEventListener('click', function(event) {
    const sidebar = document.querySelector('.sidebar');
    const toggle = document.getElementById('sidebar-toggle');
    if (!sidebar.contains(event.target) && !toggle.contains(event.target)) {
      sidebar.classList.remove('open');
    }
  });
});
</script>
