   ========================================================================= */
const statusPop = document.getElementById('statusFilterPop');
const categoryPop = document.getElementById('categoryFilterPop');

function closeAllPops(){ statusPop.classList.remove('show'); categoryPop.classList.remove('show'); }

document.querySelectorAll('.filter-arrow').forEach(arrow=>{
  arrow.addEventListener('click', (e)=>{
    e.stopPropagation();
    const type = arrow.dataset.filter;
    const rect = arrow.getBoundingClientRect();
    const wrapRect = document.getElementById('gridWrap').getBoundingClientRect();
    if(type === 'status'){
      renderStatusPop();
      statusPop.style.left = (rect.left - wrapRect.left) + 'px';
      statusPop.style.top = (rect.bottom - wrapRect.top + 4) + 'px';
      categoryPop.classList.remove('show');
      statusPop.classList.toggle('show');
    }else{
      renderCategoryPop();
      categoryPop.style.left = (rect.left - wrapRect.left - 40) + 'px';
      categoryPop.style.top = (rect.bottom - wrapRect.top + 4) + 'px';
      statusPop.classList.remove('show');
      categoryPop.classList.toggle('show');
    }
  });
});
document.addEventListener('click', closeAllPops);

function renderStatusPop(){
  const all = [['ready','Готово'],['draft','Черновик'],['internal','Внутреннее']];
  statusPop.innerHTML = all.map(([val,lbl])=>`
    <label><input type="checkbox" data-status="${val}" ${statusFilter.has(val)?'checked':''}> ${lbl}</label>
  `).join('') + `<div class="fp-actions"><button id="fpStatusAll">Все</button><button id="fpStatusApply">Применить</button></div>`;
  statusPop.querySelectorAll('input').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) statusFilter.add(cb.dataset.status); else statusFilter.delete(cb.dataset.status);
    });
  });
  statusPop.querySelector('#fpStatusAll').addEventListener('click', ()=>{
    statusFilter = new Set(['ready','draft','internal']);
    renderStatusPop();
  });
  statusPop.querySelector('#fpStatusApply').addEventListener('click', ()=>{
    document.querySelector('[data-filter="status"]').parentElement.classList.toggle('filtered', statusFilter.size < 3);
    statusPop.classList.remove('show');
    renderRows();
  });
}
function renderCategoryPop(){
  categoryPop.innerHTML = `<div style="max-height:260px;overflow-y:auto;">` + CATEGORIES.map(c=>`
    <label><input type="radio" name="fp-cat" data-cat="${c.id}" ${c.id===currentSheet?'checked':''}> ${c.icon?c.icon+' ':''}${c.label}</label>
  `).join('') + `</div><div class="fp-actions"><button id="fpCatApply">Применить</button></div>`;
  categoryPop.querySelectorAll('input').forEach(r=>{
    r.addEventListener('change', ()=>{ currentSheet = r.dataset.cat; });
  });
  categoryPop.querySelector('#fpCatApply').addEventListener('click', ()=>{
    categoryPop.classList.remove('show');
    renderTabs(); renderRows();
  });
}
function resetFilters(){
  statusFilter = new Set(['ready','draft','internal']);
  currentSheet = 'all';
  searchInput.value = '';
  document.querySelector('[data-filter="status"]').parentElement.classList.remove('filtered');
  renderTabs(); renderRows();
}

function populateCategorySelect(selectedCatId){
  const sel = document.getElementById('f-category');
  const opts = CATEGORIES.filter(c=>c.id!=='all').map(c=>`<option value="${c.id}">${c.icon} ${c.label}</option>`).join('');
  sel.innerHTML = opts;
  sel.value = selectedCatId && CATEGORIES.some(c=>c.id===selectedCatId) ? selectedCatId : (CATEGORIES.find(c=>c.id!=='all')||{}).id;

function setStatusRadio(status){
  document.querySelectorAll('#f-status-radios input').forEach(r=>r.checked=(r.value===(status||'ready')));
  refreshStatusRadioStyles();
}
function refreshStatusRadioStyles(){
  document.querySelectorAll('#f-status-radios label').forEach(l=>{
    const val = l.dataset.val;
    l.classList.toggle('checked-'+val, l.querySelector('input').checked);
  });
}
document.querySelectorAll('#f-status-radios input').forEach(r=>r.addEventListener('change', refreshStatusRadioStyles));

function addLinkRow(label, url){
  const wrap = document.getElementById('f-links');
  const row = document.createElement('div');
  row.className = 'link-row';
  row.innerHTML = `
    <input type="text" class="link-label" placeholder="Название ссылки" value="${label?label.replace(/"/g,'&quot;'):''}">
    <input type="text" class="link-url" placeholder="https://docs.redsms.ru/…" value="${url?url.replace(/"/g,'&quot;'):''}">
    <button type="button" title="Удалить ссылку" onclick="this.parentElement.remove()">✕</button>
  `;
  wrap.appendChild(row);
}
function clearLinkRows(){ document.getElementById('f-links').innerHTML = ''; }

function openEditModal(id){
  editingId = id;
  const isEdit = id !== null;
  document.getElementById('edit-modal-title').textContent = isEdit ? 'Редактировать строку' : 'Новая строка';
  document.getElementById('f-delete-btn').style.display = isEdit ? '' : 'none';
  clearLinkRows();
  if(isEdit){
    const item = data.find(d=>d.id===id);
    const d = item.details || {};
    document.getElementById('f-title').value = item.title||'';
    document.getElementById('f-description').value = item.description||'';
    document.getElementById('f-trigger').value = d.trigger||'';
    document.getElementById('f-action').value = d.action||'';
    document.getElementById('f-response').value = d.response||'';
    populateCategorySelect(item.category);
    setStatusRadio(item.status);
    (d.links||[]).forEach(l=>addLinkRow(l[0],l[1]));
  }else{
    document.getElementById('f-title').value = '';
    document.getElementById('f-description').value = '';
    document.getElementById('f-trigger').value = '';
    document.getElementById('f-action').value = '';
    document.getElementById('f-response').value = '';
    populateCategorySelect(currentSheet!=='all' ? currentSheet : null);
    setStatusRadio('ready');
  }
  document.getElementById('edit-modal').classList.add('active');
}
function closeEditModal(){
  document.getElementById('edit-modal').classList.remove('active');
  editingId = null;
}
document.getElementById('edit-modal').addEventListener('click', (e)=>{
  if(e.target.id === 'edit-modal') closeEditModal();
});
function saveCardForm(){
  const title = document.getElementById('f-title').value.trim();
  if(!title){ alert('Укажите заголовок вопроса.'); return; }
  const categoryId = document.getElementById('f-category').value;
  const status = document.querySelector('#f-status-radios input:checked').value;
  const description = document.getElementById('f-description').value.trim();
  const trigger = document.getElementById('f-trigger').value.trim();
  const action = document.getElementById('f-action').value.trim();
  const response = document.getElementById('f-response').value.trim();
  const links = Array.from(document.querySelectorAll('#f-links .link-row')).map(row=>{
    const label = row.querySelector('.link-label').value.trim();
    const url = row.querySelector('.link-url').value.trim();
    return (label && url) ? [label,url] : null;
  }).filter(Boolean);

  const details = {};
  if(trigger) details.trigger = trigger;
  if(action) details.action = action;
  if(response) details.response = response;
  if(links.length) details.links = links;

  const autoDescription = description || trigger.slice(0,140) || action.slice(0,140) || '';

  if(editingId !== null){
    const item = data.find(d=>d.id===editingId);
    item.title = title; item.category = categoryId; item.status = status;
    item.description = autoDescription; item.details = details;
  }else{
    data.push({id: nextId(), title, category: categoryId, status, description: autoDescription, details});
  }
  saveState();
  closeEditModal();
  renderTabs(); renderRows();
}
function deleteCurrentCard(){
  if(editingId === null) return;
  if(!confirm('Удалить эту строку без возможности восстановления?')) return;
  data = data.filter(d=>d.id!==editingId);
  saveState();
  closeEditModal();
  renderTabs(); renderRows();
}

/* =========================================================================
   EXPORT / IMPORT
   ========================================================================= */
function exportJSON(){
  const payload = {categories: CATEGORIES, data, exportedAt: new Date().toISOString()};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'redsms-knowledge-base-export.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
document.getElementById('file-import').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!Array.isArray(parsed.categories) || !Array.isArray(parsed.data)) throw new Error('Неверный формат файла');
      if(!confirm(`Импортировать ${parsed.data.length} строк и ${parsed.categories.length} категорий? Текущие данные будут заменены.`)) return;
      CATEGORIES = parsed.categories; data = parsed.data;
      rebuildCatLookups(); saveState();
      currentSheet = 'all';
      renderTabs(); renderRows();
    }catch(err){ alert('Не удалось прочитать файл: ' + err.message); }
    finally{ e.target.value = ''; }
  };
  reader.readAsText(file);
});

/* =========================================================================
   AUTH
   ========================================================================= */
const LS_AUTH_KEY = 'redsms_kb_authed_v1';
// Хэш пароля (SHA-256). Текущий пароль: redsms
// Чтобы сменить пароль: в консоли браузера выполните
//   crypto.subtle.digest('SHA-256', new TextEncoder().encode('НОВЫЙ_ПАРОЛЬ'))
//     .then(b => console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
// и вставьте результат вместо строки ниже.
const APP_PASSWORD_HASH = '86f9c7bc5c61011a10ecb1a282c283bee74a8e14d5abd0345b58a2bee28618e2';

async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

const loginForm = document.getElementById('loginForm');
const loginPassword = document.getElementById('loginPassword');
const loginError = document.getElementById('loginError');
const loginCard = document.querySelector('.login-card');

function markAuthed(){
  try{ localStorage.setItem(LS_AUTH_KEY, '1'); }catch(e){}
  document.documentElement.classList.add('kb-authed');
}
function clearAuthed(){
  try{ localStorage.removeItem(LS_AUTH_KEY); }catch(e){}
  document.documentElement.classList.remove('kb-authed');
}
function isAuthed(){
  try{ return localStorage.getItem(LS_AUTH_KEY) === '1'; }catch(e){ return false; }
}

loginForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  loginError.classList.remove('show');
  const val = loginPassword.value;
  if(!val) return;
  const hash = await sha256Hex(val);
  if(hash === APP_PASSWORD_HASH){
    markAuthed();
    initApp();
  }else{
    loginError.classList.add('show');
    loginPassword.value = '';
    loginPassword.focus();
    loginCard.classList.remove('shake');
    void loginCard.offsetWidth; // перезапуск анимации
    loginCard.classList.add('shake');
  }
});

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  if(!confirm('Выйти из базы знаний?')) return;
  clearAuthed();
  location.reload();
});

let appInitialized = false;
function initApp(){
  if(appInitialized) return;
  appInitialized = true;
  renderTabs();
  renderRows();
}

if(isAuthed()){
  initApp();
}
