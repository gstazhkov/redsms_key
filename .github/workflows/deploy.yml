name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REDSMS_PASSWORD: ${{ secrets.REDSMS_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          NODE_ENV: production
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: REDSMS_PASSWORD,SESSION_SECRET,NODE_ENV
          script_stop: true
          script: |
            set -eu
            cd /root/redsms_key
            git fetch origin main
            test -n "${REDSMS_PASSWORD:-}"
            test -n "${SESSION_SECRET:-}"
            git archive origin/main | tar --exclude='data' -x
            test -f public/login.html
            grep -q "/api/auth/login" public/index.html
            npm install --omit=dev
            pm2 delete redsms_key 2>/dev/null || true
            REDSMS_PASSWORD="$REDSMS_PASSWORD" SESSION_SECRET="$SESSION_SECRET" NODE_ENV=production pm2 start server.js --name redsms_key
            pm2 save
            echo "Deployed commit: $(git rev-parse --short origin/main)"